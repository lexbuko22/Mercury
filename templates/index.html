<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Horoscope</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f7f7f7;
            font-family: 'Arial', sans-serif;
        }
        .container {
            max-width: 600px;
            margin-top: 50px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            font-size: 18px;
            border: none;
        }
        .btn-submit:hover {
            background-color: #0056b3;
        }
        .footer {
            text-align: center;
            margin-top: 50px;
            color: #777;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Welcome to Your Horoscope</h1>
            <p>Enter your birthdate or zodiac sign to get your horoscope for today!</p>
        </div>
        
        <form action="/generate_horoscope" method="POST">
            <div class="form-group">
                <label for="birthdate">Enter your Birthdate (Optional)</label>
                <input type="date" id="birthdate" name="birthdate" class="form-control">
                <p class="text-center">OR</p>
                <label for="zodiac-sign">Enter your Zodiac Sign (Optional)</label>
                <input type="text" id="zodiac-sign" name="zodiac_sign" class="form-control" placeholder="e.g., Aries">
            </div>
            <button type="submit" class="btn-submit">Generate Horoscope</button>
        </form>
    </div>
    
    <div class="footer">
        <p>&copy; 2025 Mercury. All rights reserved.</p>
    </div>
</body>
</html>
